[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emgforge"
version = "0.1.0"
description = "Synthetic EMG / MUAP forward-model data generation: FEM volume conductor -> SFAP -> MUAP / HD-sEMG."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dimitrios Halatsis" }]
keywords = [
    "EMG", "MUAP", "electromyography", "HD-sEMG",
    "FEM", "volume-conductor", "biomedical", "simulation",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Pip-installable runtime dependencies. NOTE: the FEM stack — `fenics-dolfinx`
# and `gmsh` — is conda-only (not on PyPI); install it via environment.yml.
dependencies = [
    "numpy",
    "scipy",
    "mpi4py",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
# Learned-pipeline extra (neural-field regressors). Install with: pip install -e ".[ml]"
ml = ["torch"]
# MRI-FEM forearm anatomy pipeline (mri/core). Install with: pip install -e ".[mri]"
mri = ["nibabel", "scikit-image", "trimesh", "meshio", "fast-simplification", "pytetwild"]

# Import packages in this repo:
#   * `emgforge.synthesis`  phi -> SFAP -> MUAP synthesis (pure NumPy/SciPy)   src/
#   * `emgop`               FEM volume-conductor toolkit                        src/
#   * `mri`                 MRI forearm anatomy -> FEM lead field              repo root
# Folding `emgop` and `mri` into `emgforge` is tracked in the backlog. `mri.core`
# needs only the FEM stack; its segmentation/meshing modules pull the [mri] extra
# lazily, at call time.
[tool.setuptools]
packages = [
    "emgforge",
    "emgforge.synthesis",
    "emgforge.synthesis.engines",
    "emgop",
    "emgop.analytical",
    "emgop.fem",
    "emgop.meshing",
    "emgop.pointcloud",
    "emgop.sampling",
    "emgop.voxel",
    "mri",
    "mri.core",
]

[tool.setuptools.package-dir]
"" = "src"
"mri" = "mri"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
