[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emgforge"
version = "0.1.0"
description = "Synthetic EMG / MUAP forward-model data generation: FEM volume conductor -> SFAP -> MUAP / HD-sEMG."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dimitrios Halatsis" }]
keywords = [
    "EMG", "MUAP", "electromyography", "HD-sEMG",
    "FEM", "volume-conductor", "biomedical", "simulation",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Pip-installable runtime dependencies. NOTE: the FEM stack — `fenics-dolfinx`
# and `gmsh` — is conda-only (not on PyPI); install it via environment.yml.
dependencies = [
    "numpy",
    "scipy",
    "mpi4py",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
# Learned-pipeline extra (neural-field regressors). Install with: pip install -e ".[ml]"
ml = ["torch"]
# MRI-FEM forearm anatomy pipeline (mri/core). Install with: pip install -e ".[mri]"
mri = ["nibabel", "scikit-image", "trimesh", "meshio", "fast-simplification", "pytetwild"]

# Two src-layout packages:
#   emgforge      the forward model — synthesis, fem (+ LeadField solve), mri,
#                 meshing, sampling, analytical  (produces the volume-conductor solution)
#   neural_field  the ML/dataset sibling — samples that solution onto voxel grids /
#                 point clouds for neural-field & PINN training. Depends one-way on
#                 emgforge; emgforge never imports it.
[tool.setuptools]
packages = [
    "emgforge",
    "emgforge.synthesis",
    "emgforge.synthesis.engines",
    "emgforge.fem",
    "emgforge.analytical",
    "emgforge.meshing",
    "emgforge.sampling",
    "emgforge.mri",
    "emgforge.mri.core",
    "neural_field",
    "neural_field.voxel",
    "neural_field.pointcloud",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
